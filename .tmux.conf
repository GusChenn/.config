# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Enable tmux continuum
set -g @continuum-restore 'on'

# Set shell
set-option -g default-shell /bin/zsh

# Fix colors in nvim and set colorscheme
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",*:RGB"
# set-option -ga terminal-features ",alacritty:usstyle"
set -as terminal-features ',tmux-256color:extkeys'

# Start windows and panes at index 1
set -s escape-time 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g extended-keys on
set -g extended-keys-format csi-u
# bind -n S-Enter send-keys Escape "[13;2u"

# Enable mouse support
set -g mouse on

# Set Ctrl Space as <prefix>
unbind M-b
unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

# Custom mappings
# ------------------------------------------------------
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind q kill-pane
bind Q kill-session
bind r source-file ~/.tmux.conf

bind -n 'C-.' next-window
bind -n 'C-,' previous-window
bind -n 'C-q' kill-pane
bind -n 'C-f' resize-pane -Z
bind -n 'C-t' new-window
bind -n 'C-;' copy-mode

# Faster scrolling in copy mode
bind -T copy-mode-vi C-n send-keys -X halfpage-down
bind -T copy-mode-vi C-p send-keys -X halfpage-up

# Unbind scrolling in copy mode
unbind -T copy-mode-vi C-b
unbind -T copy-mode-vi C-f
unbind -T copy-mode C-b
unbind -T copy-mode C-f

# Simulates tiling windows
window_panes="#{window_panes}"
bind -n 'C-Enter' select-pane -t 'bottom-right' \; if-shell -F "#{e|m:$window_panes,2}" 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"'

# ------------------------------------------------------

# Statusbar style tweaks
# ------------------------------------------------------
# Index → glyph mapping (customize these)
set -g @index-glyph-1  ''
set -g @index-glyph-2  '󰒋'
set -g @index-glyph-3  ''
set -g @index-glyph-4  ''
set -g @index-glyph-5  ''
set -g @index-glyph-6  ''
set -g @index-glyph-7  ''
set -g @index-glyph-8  ''
set -g @index-glyph-default '#I'  # Fallback for >10

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# panes
# For dark mode:
# set -g pane-border-style 'fg=#f2d5cf'
# set -g pane-active-border-style 'fg=#f2d5cf'

# For light mode:
set -g pane-border-style 'fg=#C678DD'
set -g pane-active-border-style 'fg=#C678DD'

# statusbar
set -g status-position top
set -g status-justify right
set -g status-style 'bg=default'

set -g status-left ''
set -g status-right ''

# Add date/ time
# wip

# For dark mode
# setw -g window-status-current-style 'fg=#FAFAFA'

# For light mode
setw -g window-status-current-style 'fg=#C678DD'
setw -g window-status-current-format ' #{?#{==:#I,1},#{@index-glyph-1},#{?#{==:#I,2},#{@index-glyph-2},#{?#{==:#I,3},#{@index-glyph-3},#{?#{==:#I,4},#{@index-glyph-4},#{?#{==:#I,5},#{@index-glyph-5},#{?#{==:#I,6},#{@index-glyph-6},#{?#{==:#I,7},#{@index-glyph-7},#{?#{==:#I,8},#{@index-glyph-8},#{@index-glyph-default}}}}}}}}} '

setw -g window-status-style 'fg=#404040'
setw -g window-status-format ' #{?#{==:#I,1},#{@index-glyph-1},#{?#{==:#I,2},#{@index-glyph-2},#{?#{==:#I,3},#{@index-glyph-3},#{?#{==:#I,4},#{@index-glyph-4},#{?#{==:#I,5},#{@index-glyph-5},#{?#{==:#I,6},#{@index-glyph-6},#{?#{==:#I,7},#{@index-glyph-7},#{?#{==:#I,8},#{@index-glyph-8},#{@index-glyph-default}}}}}}}}} '

# ------------------------------------------------------

# vim-tmux-navigator original configs
# ------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" { send-keys C-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -n 'C-j' if-shell "$is_vim" { send-keys C-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind-key -n 'C-k' if-shell "$is_vim" { send-keys C-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind-key -n 'C-l' if-shell "$is_vim" { send-keys C-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }

bind-key -T copy-mode-vi 'C-h' if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind-key -T copy-mode-vi 'C-j' if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind-key -T copy-mode-vi 'C-k' if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind-key -T copy-mode-vi 'C-l' if-shell -F '#{pane_at_right}'  {} { select-pane -R }
# ------------------------------------------------------

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Added this here to override tilish mappings
unbind M-T
